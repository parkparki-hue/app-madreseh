<script>
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

/* ================= تنظیمات ================= */
const SETTINGS = {
  APP_NAME: "پلتفرم آموزشی",
  SHORT_NAME: "آموزشیار",
  ADMIN_PIN: "",
  SOCIAL: { "تلگرام": "", "اینستاگرام": "", "واتس‌اپ": "", "ایتا": "" }
};
const CURRENT_VERSION = "3.0.0";
const IS_STUDENT = window.__STUDENT__ === true;
const IS_HOSTED = /^https?:$/.test(location.protocol);
const IS_LOCAL = ['localhost','127.0.0.1'].includes(location.hostname);
const ADMIN_ALLOWED = !IS_STUDENT && (!IS_HOSTED || IS_LOCAL || location.search.includes('admin'));

window.onerror = (m, u, l) => { const b = document.getElementById('error-box'); b.style.display = 'block'; b.textContent += 'Error: ' + m + ' (line ' + l + ')\n'; };
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fa = n => Number(n).toLocaleString('fa-IR');
const enc = o => encodeURIComponent(JSON.stringify(o));
const dec = s => { try { return JSON.parse(decodeURIComponent(s)); } catch (e) { return null; } };
function toast(t) { const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2200); }

const ICONS = {
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>',
  set:'<svg viewBox="0 0 24 24"><path d="M4 6h8M18 6h2M4 12h2M10 12h10M4 18h10M18 18h2"/><circle cx="15" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
};
$('btn-back').innerHTML = ICONS.back;
const NAV = [['home','خانه'],['search','جستجو'],['progress','کتاب‌های من'],['settings','تنظیمات']];
$('nav').innerHTML = NAV.map(n => `<button class="nav-btn" data-act="tab-nav" data-id="${n[0]}"><span class="ico">${ICONS[n[0]==='progress'?'chart':n[0]==='settings'?'set':n[0]]}</span>${n[1]}</button>`).join('');

/* ================= ذخیره‌سازی ================= */
const store = {
  db: null,
  async open() {
    if (this.db || !window.indexedDB) return;
    await new Promise(res => {
      const r = indexedDB.open('edu_platform', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => res();
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) { try { res(JSON.parse(localStorage.getItem('kv_' + k))); } catch (e) { res(null); } return; }

const te_ = new TextEncoder(), td_ = new TextDecoder();

const aesKey = (raw, use) => crypto.subtle.importKey('raw', raw, 'AES-GCM', false, use);
async function encObj(raw, obj) { const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, await aesKey(raw, ['encrypt']), te_.encode(JSON.stringify(obj))); return { iv:b64(iv), ct:b64(new Uint8Array(ct)) }; }

const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const normCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const validCode = c => c.length === 16 && [...c].every(ch => ALPHA.includes(ch));

}

const policyLocked = (b, l) => { const a = bookAcc(b); return a.paid && b.lessons.indexOf(l) >= a.free; };

function applyCatalog(cat) {
  const old = {}; appData.forEach(g => g.books.forEach(b => old[b.id] = b));
  appData = cat.grades.map(g => ({ ...g, books:g.books.map(b => { const o = old[b.id];
    return { id:b.id, title:b.title, icon:b.icon, img:b.img, meta:{ rev:b.rev, size:b.size, file:b.file, lessons:b.lessons }, acc:b.acc, lessons:o ? o.lessons : [], dl:o ? o.dl : null }; }) }));
  searchIndex = null;
}
async function loadStudent() {
  let cat = window.__CATALOG__;
  if (cat) store.set('catalog', cat).catch(() => {}); else cat = await store.get('catalog');
  appData = []; if (!cat) return;
  applyCatalog(cat);
  for (const g of appData) for (const b of g.books) { const pk = await store.get('pack:' + b.id); if (pk && pk.lessons) { b.lessons = pk.lessons; b.dl = { rev:pk.rev }; await unlockFromStore(b); } }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
function refreshCatalog() {
  return new Promise(res => {
    const sc = document.createElement('script'); sc.src = 'data/catalog.js?t=' + Date.now();
    sc.onload = () => { sc.remove(); if (window.__CATALOG__) { store.set('catalog', window.__CATALOG__).catch(() => {}); applyCatalog(window.__CATALOG__); } res(true); };
    sc.onerror = () => { sc.remove(); res(false); };
    document.head.appendChild(sc);
  });
}
function loadPackScript(b) {
  return new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'data/' + b.meta.file;
    sc.onload = () => { sc.remove(); const pk = window.__PACK__ && window.__PACK__[b.id]; if (pk) { delete window.__PACK__[b.id]; res(pk); } else rej(new Error('bad pack')); };
    sc.onerror = () => { sc.remove(); rej(new Error('network')); };
    document.head.appendChild(sc);
  });
}
async function downloadBook(b) {

  try {

    b.lessons = pk.lessons; b.dl = { rev:pk.rev }; await unlockFromStore(b); searchIndex = null; toast('کتاب دریافت شد'); return true;
  } catch (e) { alert('دریافت کتاب ناموفق بود. اتصال اینترنت را بررسی کنید.'); return false; }

}

/* ================= پیشرفت ================= */
function lessonProg(b, l) {
  const tabs = parseTabs(l.fullHtml), k = lk(b, l); let done = 0;
  tabs.forEach((t, i) => {
    let ok = !!(prog.tabs[k] && prog.tabs[k][i]);
    const m = (t.content.match(/data-quiz=/g) || []).length;
    for (let q = 0; ok && q < m; q++) if (!(prog.quiz[k] && prog.quiz[k][i + ':' + q])) ok = false;
    if (ok) done++;
  });
  return { done, total:tabs.length, p:Math.round(done * 100 / tabs.length) };
}
const statusOf = (b, l) => prog.status[lk(b, l)] || '';
function setStatus(b, l, st) { const k = lk(b, l); if (prog.status[k] === st) delete prog.status[k]; else prog.status[k] = st; saveProg(); }
const bookTotal = b => b.meta ? b.meta.lessons.length : b.lessons.length;
function bookStats(b) {
  let read = 0, rev = 0;
  b.lessons.forEach(l => { const s = statusOf(b, l); if (s === 'read') read++; else if (s === 'review') rev++; });
  const total = bookTotal(b); return { read, rev, total, p:total ? Math.round(read * 100 / total) : 0 };
}
const isMineBook = b => prog.books.some(m => m.b === b.id);
function toggleMineBook(g, b) {
  const i = prog.books.findIndex(m => m.b === b.id);
  if (i >= 0) prog.books.splice(i, 1); else prog.books.push({ g:g.id, b:b.id });
  saveProg(); toast(i >= 0 ? 'از کتاب‌های من حذف شد' : 'به کتاب‌های من اضافه شد');
}
function refreshLessonProg() {
  const b = B(), l = L(); if (!b || !l || !$('lp-bar')) return;
  const p = lessonProg(b, l); $('lp-bar').style.width = p.p + '%';
  $('lp-txt').textContent = fa(p.done) + ' از ' + fa(p.total) + ' بخش · ' + fa(p.p) + '٪';
}
const lessonsIn = (list) => list.flatMap(g => g.books.flatMap(b => b.lessons.map(l => ({ b, l, g }))));
const ciHtml = x => x.img ? `<div class="ci has-img"><img src="${esc(x.img)}" alt=""></div>` : `<div class="ci">${esc(x.icon || '📄')}</div>`;

let parsedTabs = [];
function parseTabs(html) {
  if (!html || !html.trim()) return [{ name:'محتوا', content:'<div class="empty">محتوایی ثبت نشده است.</div>' }];
  const re = /<!--\s*TAB:\s*(.*?)\s*-->([\s\S]*?)(?=<!--\s*TAB:|$)/g; let m, t = [];
  while ((m = re.exec(html)) !== null) t.push({ name:m[1].trim(), content:m[2].trim() });
  return t.length ? t : [{ name:'محتوا', content:html }];
}
const legacyClean = h => String(h).replace(/color:\s*#(?:34d399|cbd5e1|e2e8f0|e0e0e0|94a3b8|10b981)\s*;?/gi, '');

/* ================= بلوک‌های تعاملی ================= */
function hydrate(root, live) {
  root.querySelectorAll('[data-tree]').forEach(el => {
    const d = dec(el.dataset.tree); if (!d) return;
    el.className = ''; el.removeAttribute('contenteditable');
    el.innerHTML = `<div class="tree-root">${esc(d.r)}</div><div class="tree-branches">${(d.b || []).map(x => `<div class="tree-node"><strong>${esc(x.t)}</strong>${x.d ? `<span>${esc(x.d)}</span>` : ''}</div>`).join('')}</div>`;
  });
  root.querySelectorAll('[data-media]').forEach(el => {
    const d = dec(el.dataset.media); if (!d || !/^https?:\/\//i.test(d.u || '')) return;
    el.className = 'media'; el.removeAttribute('contenteditable');
    const u = esc(d.u), t = d.t ? `<div class="media-t">${esc(d.t)}</div>` : '';
    const card = (ico, extra) => `<div class="file-card"><span style="font-size:1.5rem">${ico}</span><div class="fn">${esc(d.t || d.u)}</div><a class="btn sm" href="${u}" target="_blank" rel="noopener">باز کردن</a><a class="btn sm ghost" href="${u}" target="_blank" rel="noopener" download>دانلود</a>${extra || ''}<div class="pdf-slot" style="flex-basis:100%"></div></div>`;
    let h = '';
    if (d.k === 'video') { const emb = mediaEmbed(d.u);
      h = emb ? `<div class="ratio"><iframe src="${esc(emb)}" allowfullscreen allow="fullscreen; picture-in-picture" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>`
        : /\.(mp4|webm|ogv|mov|m3u8)(\?|#|$)/i.test(d.u) ? `<video controls playsinline preload="metadata" src="${u}"></video>` : card('🎬'); }
    else if (d.k === 'audio') h = `<audio controls preload="none" src="${u}"></audio>`;
    else if (d.k === 'image') h = `<img src="${u}" alt="${esc(d.t || '')}" loading="lazy">`;
    else if (d.k === 'pdf') h = card('📄', navigator.pdfViewerEnabled ? '<button class="btn sm ghost" data-act="pdf-embed">نمایش</button>' : '');
    else h = card(d.k === 'file' ? '📎' : '🔗');
    el.innerHTML = t + h;
  });
  root.querySelectorAll('[data-pdf]').forEach(el => {
    el.className = 'file-card'; el.removeAttribute('contenteditable');
    el.innerHTML = `<span style="font-size:1.5rem">📄</span><div class="fn">${esc(el.dataset.name || 'فایل PDF')}</div><button class="btn sm" data-act="pdf-open">باز کردن</button><button class="btn sm ghost" data-act="pdf-dl">دانلود</button>${navigator.pdfViewerEnabled ? '<button class="btn sm ghost" data-act="pdf-view">نمایش</button>' : ''}<div class="pdf-slot" style="flex-basis:100%"></div>`;
  });
  root.querySelectorAll('[data-quiz]').forEach((el, qi) => {
    const d = dec(el.dataset.quiz); if (!d || !d.q) return;
    el.className = 'quiz'; el.removeAttribute('contenteditable');
    const key = S.t + ':' + qi, lesson = L(), book = B();
    const best = lesson && prog.quiz[lk(book, lesson)] && prog.quiz[lk(book, lesson)][key];
    let answered = 0, correct = 0;
    el.innerHTML = d.q.map((q, i) => `<div class="qq" data-i="${i}"><div class="qt">${fa(i + 1)}. ${esc(q.t)}</div>${q.o.map((o, j) => `<button class="qopt" data-j="${j}">${esc(o)}</button>`).join('')}<div class="qexp" hidden></div></div>`).join('') +
      `<div class="quiz-foot"><span class="qscore">${best ? 'بهترین نتیجه: ' + fa(best.s) + ' از ' + fa(best.t) : ''}</span><button class="btn sm ghost" data-reset hidden>شروع دوباره</button></div>`;
    el.querySelectorAll('.qopt').forEach(btn => btn.addEventListener('click', () => {
      const qq = btn.closest('.qq'), q = d.q[+qq.dataset.i], j = +btn.dataset.j;
      qq.querySelectorAll('.qopt').forEach((o, k) => { o.disabled = true; if (k === q.a) o.classList.add('ok'); });
      if (j !== q.a) btn.classList.add('bad'); else correct++;
      if (q.e) { const ex = qq.querySelector('.qexp'); ex.textContent = q.e; ex.hidden = false; }
      if (++answered === d.q.length) {
        el.querySelector('.qscore').textContent = 'نتیجه: ' + fa(correct) + ' از ' + fa(d.q.length);
        el.querySelector('[data-reset]').hidden = false;
        if (lesson && live) { const k = lk(book, lesson); prog.quiz[k] = prog.quiz[k] || {}; if (!prog.quiz[k][key] || prog.quiz[k][key].s < correct) prog.quiz[k][key] = { s:correct, t:d.q.length }; saveProg(); refreshLessonProg(); }
      }
    }));
    el.querySelector('[data-reset]').addEventListener('click', () => { hydrateReset(el, d); });
  });
  root.querySelectorAll('script').forEach(old => { const s = document.createElement('script'); for (const a of old.attributes) s.setAttribute(a.name, a.value); s.textContent = old.textContent; old.replaceWith(s); });
}
function mediaEmbed(u) {
  let m;
  if ((m = u.match(/aparat\.com\/v\/([A-Za-z0-9]+)/))) return 'https://www.aparat.com/video/video/embed/videohash/' + m[1] + '/vt/frame';
  if (/aparat\.com\/video\/video\/embed\//.test(u)) return u;
  if ((m = u.match(/(?:youtube\.com\/watch\?[^#]*v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/))) return 'https://www.youtube-nocookie.com/embed/' + m[1];
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return 'https://player.vimeo.com/video/' + m[1];
  return null;
}
function hydrateReset() { renderLesson($('view')); }

function pdfBlob(dataUrl) { const [h, b64] = dataUrl.split(','); const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type:'application/pdf' }); }

/* ================= جستجو ================= */
function norm(s) { return String(s).replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776).replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).toLowerCase(); }
function htmlText(h) {
  let extra = '';
  (h.match(/data-quiz="([^"]*)"/g) || []).forEach(m => { const d = dec(m.slice(11, -1)); if (d && d.q) d.q.forEach(q => extra += ' ' + q.t + ' ' + q.o.join(' ')); });
  (h.match(/data-tree="([^"]*)"/g) || []).forEach(m => { const d = dec(m.slice(11, -1)); if (d) extra += ' ' + d.r + ' ' + (d.b || []).map(x => x.t + ' ' + (x.d || '')).join(' '); });
  return h.replace(/<(script|style)[\s\S]*?<\/\1>/gi, ' ').replace(/data-[a-z]+="[^"]*"/gi, '').replace(/src="data:[^"]*"/gi, '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ') + extra;
}
function buildIndex() { searchIndex = lessonsIn(appData).filter(x => x.g.active !== false || isAdmin).map(x => ({ ...x, title:norm(x.l.title), text:norm(htmlText(x.l.fullHtml || '')).replace(/\s+/g, ' ') })); }
function doSearch(q) {
  const box = $('results'); const nq = norm(q.trim());
  if (nq.length < 2) { box.innerHTML = '<div class="empty">حداقل ۲ حرف بنویسید.</div>'; return; }
  if (!searchIndex) buildIndex();
  const res = [];
  searchIndex.forEach(x => {
    const ti = x.title.indexOf(nq), ci = x.text.indexOf(nq);
    if (ti < 0 && ci < 0) return;
    res.push({ x, score:(ti >= 0 ? 100 : 0) + (ci >= 0 ? 1 : 0), ci });
  });
  res.sort((a, b) => b.score - a.score);
  if (!res.length) { box.innerHTML = '<div class="empty">نتیجه‌ای پیدا نشد.</div>'; return; }
  const hl = s => esc(s).split(esc(nq)).join('<mark>' + esc(nq) + '</mark>');
  box.innerHTML = res.slice(0, 40).map(r => {
    let sn = ''; if (r.ci >= 0) { const s = Math.max(0, r.ci - 40); sn = (s ? '…' : '') + r.x.text.slice(s, r.ci + nq.length + 70) + '…'; }
    return `<div class="row" data-act="open-result" data-g="${esc(r.x.g.id)}" data-b="${esc(r.x.b.id)}" data-l="${esc(r.x.l.id)}"><div class="rt">${hl(r.x.l.title)}<div class="rs">${esc(r.x.g.title)} › ${esc(r.x.b.title)}</div>${sn ? `<div class="rs" style="margin-top:4px">${hl(sn)}</div>` : ''}</div></div>`;
  }).join('');
}
function renderSearch(v) {
  v.innerHTML = `<div class="searchbox"><span class="ico">${ICONS.search}</span><input id="q" placeholder="کلمه یا عبارت را بنویسید" value="${esc(S.q)}" autocomplete="off"></div><div id="results"></div>`;
  const inp = $('q'); let t; inp.addEventListener('input', () => { S.q = inp.value; clearTimeout(t); t = setTimeout(() => doSearch(S.q), 180); });
  doSearch(S.q); if (!S.q) inp.focus();
}
